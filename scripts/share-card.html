<!doctype html>
<!--
  Link-preview card for akibwa.com (public/share-card.jpg). It mirrors the
  homepage's first screen with the site's own fonts and project art, so render
  it on a Mac, where Avenir Next and Iowan Old Style are installed:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,630 --force-device-scale-factor=2 \
      --screenshot=/tmp/share-card.png "file://$PWD/scripts/share-card.html"
    sips -Z 1200 -s format jpeg -s formatOptions 86 /tmp/share-card.png --out public/share-card.jpg
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  :root {
    --canvas: #faf8f3;
    --black: #030405;
    --ink: #101217;
    --muted: #606976;
    --sans: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--canvas); }
  body { position: relative; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .hero { position: absolute; left: 60px; right: 60px; top: 46px; }
  .name { font-size: 118px; font-weight: 660; line-height: .92; letter-spacing: -0.06em; color: var(--black); white-space: nowrap; }
  .name span { position: relative; display: inline-block; padding-bottom: .1em; color: color-mix(in srgb, rgb(47, 136, 255) 58%, var(--black)); }
  .name span::after { content: ""; position: absolute; left: .02em; right: -.02em; bottom: -.02em; height: .1em; border-radius: 99px; background: rgba(47, 136, 255, .55); }
  .lede { margin-top: 22px; font: 400 46px/1.04 var(--serif); letter-spacing: -0.035em; white-space: nowrap; }
  .rule { position: absolute; left: 0; right: 0; top: 278px; height: 6px; background: #2f88ff; }
  .cards { position: absolute; left: 60px; right: 60px; top: 318px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card { border: 1.5px solid var(--edge); border-radius: 5px; overflow: hidden; background: var(--panel); }
  .card img { display: block; width: 100%; aspect-ratio: 5 / 2; object-fit: cover; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 13px 14px 14px; white-space: nowrap; box-shadow: inset 0 4px 0 var(--accent); background: var(--panel); color: var(--card-ink); }
  .foot strong { font-size: 17px; font-weight: 670; letter-spacing: -0.015em; }
  .foot span { font-size: 13.5px; color: var(--card-muted); }
  .features { --panel: #e2ece7; --card-ink: #163e36; --card-muted: #3f6057; --edge: #205b4f; --accent: #1b947d; }
  .portuguese { --panel: #f2efe7; --card-ink: #173b72; --card-muted: rgba(23, 59, 114, .76); --edge: #173b72; --accent: #7faaff; }
  .portuguese img { object-position: 0% 30%; }
  .trek { --panel: #f2efe7; --card-ink: #253a30; --card-muted: rgba(37, 58, 48, .76); --edge: #1e3027; --accent: #d96b32; }
  .brand { position: absolute; left: 60px; right: 60px; bottom: 26px; display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .brand .mark { display: flex; align-items: center; gap: 11px; }
  .brand img { width: 30px; height: 30px; }
  .brand .chapters { display: flex; gap: 22px; font-size: 16px; }
  .brand .chapters b:nth-child(1) { color: color-mix(in srgb, #2f88ff 80%, var(--ink)); }
  .brand .chapters b:nth-child(2) { color: color-mix(in srgb, rgb(203, 66, 94) 80%, var(--ink)); }
  .brand .chapters b:nth-child(3) { color: color-mix(in srgb, #1b947d 80%, var(--ink)); }
</style>
</head>
<body>
  <div class="hero">
    <div class="name">I’m <span>Daniel</span></div>
    <div class="lede">Building in the age of AI</div>
  </div>
  <div class="rule"></div>
  <div class="cards">
    <div class="card features"><img src="../public/_img/project-art/personal/features-discoveries-conceptProject-627.avif" alt=""><div class="foot"><strong>features</strong><span>daily untangling puzzle</span></div></div>
    <div class="card portuguese"><img src="../public/_img/project-art/personal/portuguese-with-ines-conversation-conceptProject-627.avif" alt=""><div class="foot"><strong>Português com a Inês</strong><span>Portuguese lessons</span></div></div>
    <div class="card trek"><img src="../public/_img/project-art/personal/trek-paper-landscape-conceptProject-627.avif" alt=""><div class="foot"><strong>The Trek</strong><span>Paris → Sofia · 2,237 km</span></div></div>
  </div>
  <div class="brand">
    <div class="mark"><img src="../public/brand-logos/akibwa-a.png" alt="">akibwa.com</div>
    <div class="chapters"><b>Projects</b><b>Career</b><b>Taste Library</b></div>
  </div>
</body>
</html>
