<title>Akibwa Sea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<style>
/* One screen. A sea of sleeves fills it and the name stands out of the sea; the only words are the caption that follows the pointer. */
:root {
  --ground: #0b0a0a;
  --ink: #f6efe2;
  --soft: #aca396;
  --plate: rgba(11, 10, 10, 0.88);
  --ring: #ff8a4c;
  --text: "Nunito Sans", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--text);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#sea {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
  outline: none;
}
#sea:focus-visible { box-shadow: inset 0 0 0 2px var(--ring); }
#caption {
  position: fixed;
  left: 0;
  top: 0;
  max-width: min(280px, calc(100vw - 32px));
  padding: 8px 12px 9px;
  background: var(--plate);
  pointer-events: none;
  opacity: 0;
  transition: opacity 160ms ease;
  line-height: 1.25;
}
#caption.on { opacity: 1; }
#caption b { display: block; font-size: 15px; font-weight: 700; text-wrap: balance; }
#caption span { display: block; font-size: 13px; color: var(--soft); }
@media (prefers-reduced-motion: reduce) { #caption { transition: none; } }
</style>
<canvas id="sea" tabindex="0" role="img" aria-label="Akibwa, spelt in album sleeves, in a sea of every sleeve Dan plays most. Move over it to bring sleeves up close; arrow keys move too."></canvas>
<div id="caption" aria-live="polite"><b></b><span></span><span></span></div>
